global:
  postgresql:
    auth:
      # Passwords are read from an existing Secret (keys: password,
      # postgres-password). Create it before installing:
      #   kubectl -n <namespace> create secret generic postgresql-secret \
      #     --from-literal=password="<POSTGRES_PASSWORD>" \
      #     --from-literal=postgres-password="<POSTGRES_SUPERUSER_PASSWORD>"
      # Local copy of the real value: values.local.yaml
      existingSecret: postgresql-secret
      username: "postgres"
      database: "postgres"

image:
  registry: registry-1.docker.io
  repository: bitnamilegacy/postgresql
  tag: 17.6.0

persistence:
  enabled: true
  storageClass: "hpe-rwo"
  accessMode: "ReadWriteOnce"
  size: "8Gi"

primary:
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"
# pgcat — the single client endpoint in front of the CloudNativePG cluster.
#
# Clients point at ONE address and SQL is routed by pgcat's parser:
#   psql "host=pgcat.cnpg.svc port=6432 dbname=app_db user=app_user"
#
# One container only. The password substitution that postgresql/sothanav-ha-pg needs a
# sidecar, a ServiceAccount and two Roles for collapses into these five lines, because
# the server list is static (see pgcat-configmap.yaml):
#
#   sed -e <token>=<env> /template/pgcat.toml.tpl > /config/pgcat.toml
#   exec pgcat /config/pgcat.toml
#
# Prerequisite: the admin console needs its own account, kept out of this file and out of
# git. Create it once (the value never enters the repo or your shell history file):
#
#   kubectl -n cnpg create secret generic pgcat-admin-secret \
#     --from-literal=username=pgcatadmin \
#     --from-literal=password="$(openssl rand -hex 16)"
#
# The database credentials are reused from example/db-secret.yaml (my-db-secret), the same
# Secret bootstrap.initdb consumed, so there is one source for app_user.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgcat
  namespace: cnpg
  labels:
    app.kubernetes.io/name: pgcat
    app.kubernetes.io/component: pooler
    app.kubernetes.io/part-of: my-postgres-prod
spec:
  # Every replica holds its own pools: N replicas means N x pool_size backend
  # connections against the cluster's max_connections. 2 x 30 = 60 out of the 200 in
  # example/pg-cluster.yaml, which still leaves room for the operator's replication and
  # monitoring connections. Two replicas also means one standby per replica in practice:
  # each pod holds its own pooled connection to <cluster>-ro, and kube-proxy picked a
  # different standby for each of them.
  replicas: 2
  strategy:
    type: RollingUpdate
    # maxUnavailable 0: a new pod is Ready before the old one leaves, so a rollout never
    # opens a gap in the only client endpoint.
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: pgcat
      app.kubernetes.io/component: pooler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgcat
        app.kubernetes.io/component: pooler
    spec:
      # No API access at all: nothing here reads ConfigMaps through the API server, the
      # template arrives as a volume. (The repmgr chart needed a token because its sidecar
      # polled one.)
      automountServiceAccountToken: false
      # Keeps other namespaces' <SERVICE>_HOST/_PORT variables out of pgcat's environment.
      enableServiceLinks: false
      containers:
        - name: pgcat
          # Upstream publishes no semver tags — only latest/main/per-commit SHA. Pin a
          # digest before this goes anywhere important:
          #   crane digest ghcr.io/postgresml/pgcat:latest
          # or `docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/postgresml/pgcat:latest`
          image: ghcr.io/postgresml/pgcat:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # Escape what sed would otherwise interpret inside the replacement text: a
              # backslash, an ampersand (means "the matched text"), and the | delimiter.
              # A password containing & would otherwise splice the token back in.
              # Replacement is \\& — a literal backslash followed by the match.
              esc() { printf '%s' "$1" | sed -e 's/[\&|]/\\&/g'; }
              sed -e "s|__DB_USER__|$(esc "$PGCAT_DB_USER")|g" \
                  -e "s|__DB_PASSWORD__|$(esc "$PGCAT_DB_PASSWORD")|g" \
                  -e "s|__ADMIN_USER__|$(esc "$PGCAT_ADMIN_USER")|g" \
                  -e "s|__ADMIN_PASSWORD__|$(esc "$PGCAT_ADMIN_PASSWORD")|g" \
                  /template/pgcat.toml.tpl > /config/pgcat.toml
              echo "pgcat.toml rendered from $(wc -l < /template/pgcat.toml.tpl) template lines"
              exec pgcat /config/pgcat.toml
          env:
            - name: PGCAT_DB_USER
              valueFrom:
                secretKeyRef: {name: my-db-secret, key: username}
            - name: PGCAT_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: my-db-secret, key: password}
            - name: PGCAT_ADMIN_USER
              valueFrom:
                secretKeyRef: {name: pgcat-admin-secret, key: username}
            - name: PGCAT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: pgcat-admin-secret, key: password}
          ports:
            - {name: pgcat, containerPort: 6432, protocol: TCP}
            - {name: metrics, containerPort: 9930, protocol: TCP}
          # TCP only: pgcat answers on 6432 as soon as the config parsed, and a query
          # probe would need credentials in the pod spec.
          readinessProbe:
            tcpSocket: {port: pgcat}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: pgcat}
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # NOTE: no appArmorProfile override here, on purpose. pgcat runs under the
            # node's enforced cri-containerd.apparmor.d profile in the pg-ha namespace and
            # has done so for 19h+ (/proc/1/attr/current shows the enforce label): the
            # profile only breaks processes that fork and signal their own children, which
            # is what PostgreSQL does and pgcat does not.
          volumeMounts:
            - {name: template, mountPath: /template, readOnly: true}
            - {name: config, mountPath: /config}
      volumes:
        - name: template
          configMap:
            name: pgcat-config
        # The rendered file lives here, so the substituted passwords never appear in the
        # pod spec, the ConfigMap, or `kubectl get`.
        - name: config
          emptyDir: {}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgresql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  {{- with (include "postgresql.annotations" (list .Values.commonAnnotations .Values.service.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      # -- Always 5432: the image EXPOSEs 5432 and the server binds `--with-pgport=5432`.
      # `service.port` only renames the service side of the hop
      targetPort: postgres
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "postgresql.selectorLabels" . | nindent 4 }}
  {{- /*
  InternalTrafficPolicy stays at the cluster default (Cluster): a single-replica
  database has pods in only one place anyway, and setting it to Local strands
  clients that are not on the pod's node.
  */}}

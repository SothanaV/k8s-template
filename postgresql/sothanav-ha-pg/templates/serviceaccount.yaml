{{/*
Two identities, because the two workloads need different things.

  <fullname>        database pods: publishes pgcat's config through the API (get + patch)
  <pgcat.fullname>  pgcat pod: the sidecar polls the published ConfigMap (get only)

Using one identity for both would hand the pooler a write on the object the sidecar
substitutes the real database password into — see rbac.yaml for the reasoning. Both are
scoped to that single ConfigMap by name.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sothanav-ha-pg.serviceAccountName" . }}
  namespace: {{ include "sothanav-ha-pg.namespace" . }}
  labels:
    {{- include "sothanav-ha-pg.labels" . | nindent 4 }}
  {{- with (include "sothanav-ha-pg.annotations" (list .Values.commonAnnotations .Values.serviceAccount.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.pgcat.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sothanav-ha-pg.pgcatServiceAccountName" . }}
  namespace: {{ include "sothanav-ha-pg.namespace" . }}
  labels:
    {{- include "sothanav-ha-pg.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgcat
  {{- with (include "sothanav-ha-pg.annotations" (list .Values.commonAnnotations .Values.pgcat.serviceAccount.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}

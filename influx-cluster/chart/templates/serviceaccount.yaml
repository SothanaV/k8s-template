{{/* Nothing here calls the Kubernetes API: the join Job talks to influxd-ctl over the
cluster network, and kubelet mounts Secrets without needing RBAC. Create a ServiceAccount
only when a cluster policy forbids the namespace `default` one. */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "influxdb-cluster.serviceAccountName" . }}
  labels:
    {{- include "influxdb-cluster.labels" . | nindent 4 }}
  {{- with (include "influxdb-cluster.annotations" (list .Values.commonAnnotations .Values.serviceAccount.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}

airflowVersion: "3.0.6"
defaultAirflowTag: "3.0.6"
executor: KubernetesExecutor
registry:
  secretName: reg-secret
logs:
  persistence:
    enabled: true
    storageClassName: hpe-rwx
    size: 50Gi  # Adjust based on your needs
securityContext:
  runAsUser: 50000
  fsGroup: 1001
postgresql:
  image:
    repository: bitnamilegacy/postgresql
images:
  airflow:
    repository: reg.xxx.yyy/repo
    tag: production
    pullPolicy: Always
  useDefaultImageForMigration: true
  pod_template:
    repository: reg.xxx.yyy/repo
    tag: production
    pullPolicy: Always

dagProcessor:
  extraInitContainers:
    - name: fix-log-permissions
      image: busybox
      command:
        - sh
        - -c
        - chown -R 50000:1001 /opt/airflow/logs
      volumeMounts:
        - name: logs
          mountPath: /opt/airflow/logs
      securityContext:
        runAsUser: 0 

apiServer:
  apiServerConfig: |
    from __future__ import annotations

    import os
    import requests
    from flask_appbuilder.security.manager import AUTH_OAUTH, AUTH_DB
    from airflow.providers.fab.auth_manager.security_manager.override import FabAirflowSecurityManagerOverride

    basedir = os.path.abspath(os.path.dirname(__file__))

    # Flask-WTF flag for CSRF
    WTF_CSRF_ENABLED = True

    AUTH_TYPE = AUTH_OAUTH
    #AUTH_TYPE = AUTH_DB
    OAUTH_PROVIDERS = [{
        'name':'moma',
        'token_key':'access_token',
        'icon':'fa-lock',
            'remote_app': {
                'api_base_url':'https://xxx.com/api/v1/account/me/',
                'access_token_url':'https://xxx.com/o/token/',
                'authorize_url':'https://xxx.com/o/authorize',
                'request_token_url': None,
                'client_id': "",
                'client_secret': "",
                'client_kwargs': {
                  'verify': False
                }
            }
    }]


    class CustomSecurity(FabAirflowSecurityManagerOverride):
        
        def sync_roles(self):
            super().sync_roles()

        def get_oauth_user_info(self, provider, response=None):
            if provider == "moma":
                config = OAUTH_PROVIDERS[0].get('remote_app', {})
                res = requests.get(config.get('api_base_url'), headers={
                    'Authorization': f"{response.get('token_type')} {response.get('access_token')}"
                }, verify=False)
                
                if res.status_code != 200:
                    print(res.text)
                    return {}
                
                me = res.json()
                print(me)
                
                # Extract the flat list of roles from your JSON payload
                # Defaults to an empty list if "roles" isn't found
                user_roles = me.get("roles", []) 

                for role_name in user_roles:
                    # 1. Check if the role exists in the Airflow database
                    if not self.find_role(role_name):
                        # Create the role if it doesn't exist
                        self.add_role(role_name)
                        print(f"Created new role on the fly: {role_name}")
                    
                    # 2. Dynamically update the mapping so FAB assigns it to the user
                    # This maps the API role string to the Airflow role string 1:1
                    if role_name not in self.auth_roles_mapping:
                        self.auth_roles_mapping[role_name] = [role_name]

                parsed_token = {
                    "email": me.get("email"),
                    "first_name": me.get("first_name"),
                    "last_name": me.get("last_name"),
                    "username": me.get("username"),
                    "role_keys": user_roles, # Will pass ["IT", "DataUser"] to FAB
                }
                return parsed_token
            return {}

    SECURITY_MANAGER_CLASS = CustomSecurity
    AUTH_USER_REGISTRATION = True
    AUTH_ROLES_SYNC_AT_LOGIN = True
    AUTH_USER_REGISTRATION_ROLE = "Public"

    AUTH_ROLES_MAPPING = {
        "MOM Analytics Platform (5100)": ["Admin"],       # Gives "IT" full Admin access in Airflow
        "DataUser": ["Public"],  # Gives "DataUser" standard User access (or use "Viewer")
    }
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: gitlab
  namespace: kedro
data:
  # Base64 of ~/.docker/config.json for registry.gitlab.com
  # (user: deploy). Generate with:
  #   base64 -w0 ~/.docker/config.json
  .dockerconfigjson: REPLACE_WITH_BASE64_DOCKERCONFIGJSON

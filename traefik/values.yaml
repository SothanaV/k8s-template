deployment:
  replicas: 3
ingressRoute:
  dashboard:
    enabled: false
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443
providers:
  kubernetesIngress:
    enabled: false            
  kubernetesIngressNGINX:
    enabled: true
    ingressClass: traefik
    ingressClassByName: true
    publishService:          
      enabled: true
    watchIngressWithoutClass: false
service:
  spec:
    type: NodePort

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/etcd
    operator: Exists
    effect: NoExecute
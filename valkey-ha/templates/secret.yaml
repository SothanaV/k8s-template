{{- if not .Values.auth.existingSecret }}
{{/*
Rendered ONLY when auth.existingSecret is empty: the compose-parity passwords from
values.yaml, so a plain `helm install` works out of the box. For anything long-lived,
set auth.existingSecret and manage the real Secret yourself — this object is owned by
the release and would be DELETED on uninstall, taking the passwords (and after a
restore, the data's only access) with it if you ever relied on it.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "valkey-ha.secretName" . }}
  labels:
    {{- include "valkey-ha.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.valkeyPasswordKey }}: {{ .Values.auth.valkeyPassword | quote }}
  {{ .Values.auth.sentinelPasswordKey }}: {{ .Values.auth.sentinelPassword | quote }}
  {{ .Values.auth.statsPasswordKey }}: {{ .Values.haproxy.statsPassword | quote }}
{{- end }}

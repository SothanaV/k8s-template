{{/*
Rendered only when secret.create is true. Prefer the pre-created Secret path
(`secret.existingSecret`): with this template active, the token sits in values, in the
rendered manifest, in the release secret, and in every stored revision — and `helm get
values --all` prints it. That is how the live release ended up exposing its token.
*/}}
{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-grafana.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-grafana.labels" . | nindent 4 }}
  {{- with (include "mcp-grafana.annotations" (list .Values.commonAnnotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.plainText }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end -}}
